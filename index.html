    <script>
      // Same as the BlueStep Behavioral site: set the theme before first paint
      // so there is no flash. Saved choice, else OS. The key is shared in spirit,
      // not storage: each host has its own localStorage.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0a0d12' : '#fafafb'
      })()
    </script>
